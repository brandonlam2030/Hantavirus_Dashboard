[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-api-core>=2.33.0",
    "gspread>=6.2.1",
    "joblib>=1.5.3",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "matplotlib>=3.11.1",
    "newsapi-python>=0.2.7",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "streamlit-float>=0.4.0",
    "xgboost>=3.4.0",
]

[tool.uv]
package = false
